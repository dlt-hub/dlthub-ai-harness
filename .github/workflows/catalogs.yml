name: Check catalogs

on:
  push:
    branches: [master, devel]
  # Every PR, also a PR stacked on another branch.
  pull_request:

jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generated host catalogs are not edited by hand
        run: python tools/generate_catalogs.py --check
