name: Check catalogs

on:
  pull_request:
    branches: [master, devel]

jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check host catalogs and manifests are generated from the Claude ones
        run: python tools/generate_catalogs.py --check
